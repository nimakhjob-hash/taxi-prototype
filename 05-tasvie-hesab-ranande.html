
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسویه‌حساب با راننده</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f9;font-family:Tahoma,Arial,sans-serif;color:#263449;font-size:13px}
header{background:#183b63;color:white;padding:22px 6%;box-shadow:0 3px 10px #0001}
header h2{margin:0 0 8px;font-size:20px}header p{margin:0;color:#d9e5f2}
main{max-width:1050px;margin:28px auto;padding:0 18px}
.card{background:white;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:18px;overflow:hidden;box-shadow:0 4px 14px #14213d08}
.card h3{margin:0;padding:15px 20px;background:#f8fafc;border-bottom:1px solid #e5eaf0;font-size:14px}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:20px}
label{display:block;font-weight:bold;margin-bottom:8px;color:#46556a}
input,select,textarea{width:100%;border:1px solid #cfd8e3;border-radius:7px;padding:11px;background:white;font:inherit;color:#263449}
input[readonly]{background:#f4f6f8;color:#596579}
textarea{min-height:90px;resize:vertical}
.wide{grid-column:1/-1}
.actions{display:flex;gap:10px;justify-content:flex-start;padding:0 20px 20px}
button{border:0;border-radius:7px;padding:11px 24px;font:inherit;cursor:pointer}
.primary{background:#1e5a91;color:white}.secondary{background:#e8edf3;color:#334155}
.note{font-size:11px;color:#748094;margin-top:7px}
@media(max-width:700px){.fields{grid-template-columns:1fr}.wide{grid-column:auto}}
</style>
<link rel="stylesheet" href="theme.css">
<script src="common.js"></script>
</head>
<body>
<header>
  <h2>سامانه تخصیص راننده به مراسم</h2>
  <p>فرم تسویه‌حساب با راننده</p>
</header>
<main>
  <form id="settlementForm">
    <section class="card">
      <h3>اطلاعات راننده و خودرو</h3>
      <div class="fields">
        <div><label for="plate">شماره پلاک خودرو</label><input id="plate" placeholder="شماره پلاک" readonly></div>
        <div><label for="nationalId">کد ملی راننده</label><input id="nationalId" placeholder="کد ملی" readonly></div>
        <div><label for="driver">نام و نام خانوادگی راننده</label><input id="driver" placeholder="نام راننده" readonly></div>
        <div><label for="phone">شماره تماس</label><input id="phone" placeholder="شماره تماس" readonly></div>
      </div>
    </section>
    <section class="card">
      <h3>اطلاعات مراسم</h3>
      <div class="fields">
        <div><label for="event">عنوان مراسم</label><input id="event" placeholder="عنوان مراسم" readonly></div>
      </div>
    </section>
    <section class="card">
      <h3>اطلاعات مالی و نتیجه بررسی</h3>
      <div class="fields">
      <div><label for="bank">بانک</label><input id="bank" placeholder="بانک" readonly></div>
        <div><label for="account">شماره حساب</label><input id="account" placeholder="شماره حساب" readonly></div>
        <div><label for="iban">شماره شبا</label><input id="iban" placeholder="IR..." readonly></div>
        <div><label for="amount">مبلغ قابل پرداخت (ریال)</label><input id="amount" type="text" inputmode="numeric" placeholder="مبلغ به ریال" readonly></div>
        <div><label for="status">وضعیت پرداخت</label>
          <select id="status" required>
            <option value="">انتخاب کنید</option>
            <option value="approved">تأیید</option>
            <option value="rejected">عدم تأیید</option>
          </select>
        </div>
        <div class="wide" id="reasonWrap" hidden>
          <label for="reason">علت عدم تأیید</label>
          <textarea id="reason" placeholder="علت عدم تأیید را وارد کنید"></textarea>
          <div class="note">در صورت انتخاب «عدم تأیید»، تکمیل این قسمت الزامی است.</div>
        </div>
      </div>
      <div class="actions">
        <button class="primary" type="submit">ثبت اطلاعات</button>
        <button class="secondary" type="reset">پاک کردن فرم</button>
      </div>
    </section>
  </form>
</main>
<script>
const M=window.MRS,req=M.requireCase('finance_approve');
if(req){const d=M.driver(req.driverId);M.fill({plate:d.plate,nationalId:d.nationalId,driver:d.first+' '+d.last,phone:d.mobile,event:req.ceremonyTitle,bank:req.bank,account:req.account,iban:req.sheba,amount:M.fa(req.amount)});M.addBack()}
const statusField=document.getElementById('status'),reasonWrap=document.getElementById('reasonWrap'),reason=document.getElementById('reason'),form=document.getElementById('settlementForm');
function updateReason(){const r=statusField.value==='rejected';reasonWrap.hidden=!r;reason.required=r}
statusField.addEventListener('change',updateReason);
form.addEventListener('submit',function(e){e.preventDefault();if(!this.reportValidity()||!req)return;const ok=statusField.value==='approved';
M.decide(req.id,ok,ok?'':reason.value.trim(),'عدم تأیید مالی');M.flash(ok?'تأیید شد؛ پرونده تسویه شد.':'پرونده در مرحله مالی رد شد.');location.href=M.KART});
form.addEventListener('reset',()=>setTimeout(updateReason,0));
</script>
</body>
</html>
